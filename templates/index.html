<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLGD-Pharma · 玻璃瓶缺陷智能检测系统</title>
    <link rel="preconnect" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-top">
                <span class="header-badge">SYSTEM ONLINE</span>
                <span class="header-meta">PatchCore · AUROC 100% · v2.0</span>
            </div>
            <h1>玻璃瓶缺陷智能检测<span class="accent">系统</span></h1>
            <p>基于 PatchCore 异常检测算法 · 支持实时摄像头与图片批量检测</p>
        </header>

        <!-- Tabs -->
        <nav class="tabs">
            <button class="tab-btn active" onclick="switchTab('live')">实时检测</button>
            <button class="tab-btn" onclick="switchTab('upload')">图片检测</button>
        </nav>

        <!-- Legend -->
        <div class="legend">
            <div class="legend-item"><span class="dot" style="background:#ef4444"></span>大破损 broken_large</div>
            <div class="legend-item"><span class="dot" style="background:#f59e0b"></span>小破损 broken_small</div>
            <div class="legend-item"><span class="dot" style="background:#22c55e"></span>污染 contamination</div>
        </div>

        <!-- Tab1: Live -->
        <div id="tab-live" class="tab-content active">
            <div class="live-layout">
                <div class="card">
                    <div class="card-title">实时摄像头画面</div>
                    <div class="video-wrapper">
                        <img id="videoFeed" src="/video_feed" alt="实时视频流">
                        <div class="video-overlay">
                            <span class="video-tag">LIVE</span>
                            <span class="video-tag" id="fpsTag">-- FPS</span>
                        </div>
                    </div>
                    <div class="live-controls">
                        <button class="btn" onclick="toggleVideo()">暂停 / 继续</button>
                        <button class="btn" onclick="captureSnapshot()">截图保存</button>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">检测日志</div>
                    <div id="liveLog" class="log-list">
                        <div class="log-item log-info">系统已启动，等待检测...</div>
                    </div>
                    <div class="live-stats">
                        <div class="stat-mini">
                            <span class="stat-num" id="liveFps">0</span>
                            <span class="stat-label">FPS</span>
                        </div>
                        <div class="stat-mini">
                            <span class="stat-num" id="liveDefects">0</span>
                            <span class="stat-label">缺陷数</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab2: Upload -->
        <div id="tab-upload" class="tab-content">
            <div class="upload-zone" id="uploadZone">
                <div class="upload-icon">📁</div>
                <p>点击或拖拽图片到此处上传（支持多张）</p>
                <input type="file" id="fileInput" multiple accept="image/*" style="display:none">
                <button class="btn btn-primary" onclick="event.stopPropagation(); document.getElementById('fileInput').click()">选择图片</button>
            </div>

            <div id="loading" class="loading-bar">
                <div class="spinner"></div>
                <p>正在检测中...</p>
            </div>

            <div id="resultArea" class="result-area">
                <div id="summaryStats"></div>
                <div id="imageGrid"></div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer-stats">
            <div class="footer-title">总缺陷数量统计</div>
            <div class="footer-counts">
                <div class="count-item">
                    <span class="count-dot" style="background:#ef4444"></span>
                    <span class="count-label">大破损</span>
                    <span class="count-num" id="totalBrokenLarge">0</span>
                </div>
                <div class="count-item">
                    <span class="count-dot" style="background:#f59e0b"></span>
                    <span class="count-label">小破损</span>
                    <span class="count-num" id="totalBrokenSmall">0</span>
                </div>
                <div class="count-item">
                    <span class="count-dot" style="background:#22c55e"></span>
                    <span class="count-label">污染</span>
                    <span class="count-num" id="totalContamination">0</span>
                </div>
            </div>
        </footer>
    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            if (tab === 'live') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-live').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-upload').classList.add('active');
            }
        }

        let videoPaused = false;
        function toggleVideo() {
            const img = document.getElementById('videoFeed');
            if (videoPaused) {
                img.src = '/video_feed';
                videoPaused = false;
                addLog('视频已恢复', 'info');
            } else {
                img.src = '';
                videoPaused = true;
                addLog('视频已暂停', 'warn');
            }
        }

        function captureSnapshot() {
            addLog('截图已保存', 'success');
        }

        function addLog(msg, type) {
            const log = document.getElementById('liveLog');
            const item = document.createElement('div');
            item.className = `log-item log-${type || 'info'}`;
            item.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            log.insertBefore(item, log.firstChild);
            if (log.children.length > 50) log.removeChild(log.lastChild);
        }

        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');

        uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
        uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
        uploadZone.addEventListener('drop', e => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });
        uploadZone.addEventListener('click', e => {
            if (e.target.tagName !== 'BUTTON') fileInput.click();
        });
        fileInput.addEventListener('change', e => handleFiles(e.target.files));

        function handleFiles(files) {
            if (!files.length) return;
            const formData = new FormData();
            for (let f of files) formData.append('files', f);

            document.getElementById('loading').classList.add('show');
            addLog(`开始检测 ${files.length} 张图片...`, 'info');

            fetch('/upload', { method: 'POST', body: formData })
                .then(r => r.json())
                .then(data => {
                    document.getElementById('loading').classList.remove('show');
                    if (data.success) {
                        displayResults(data);
                        updateTotalCounts(data.total_counts);
                        addLog(`检测完成，共发现 ${data.total_defects} 个缺陷`, 'success');
                    } else {
                        alert('检测失败: ' + data.error);
                        addLog('检测失败: ' + data.error, 'error');
                    }
                })
                .catch(err => {
                    document.getElementById('loading').classList.remove('show');
                    alert('请求失败: ' + err);
                });
        }

        function displayResults(data) {
            const summary = document.getElementById('summaryStats');
            const defectTotal = data.total_defects;
            summary.innerHTML = `
                <div class="summary-card">
                    <div class="summary-num accent">${data.results.length}</div>
                    <div class="summary-label">检测图片数</div>
                </div>
                <div class="summary-card">
                    <div class="summary-num ${defectTotal > 0 ? 'accent' : ''}">${defectTotal}</div>
                    <div class="summary-label">总缺陷数</div>
                </div>
                ${Object.entries(data.total_counts).map(([k, v]) => `
                    <div class="summary-card">
                        <div class="summary-num">${v}</div>
                        <div class="summary-label">${k}</div>
                    </div>
                `).join('')}
            `;

            const grid = document.getElementById('imageGrid');
            grid.innerHTML = data.results.map(r => {
                if (!r.success) {
                    return `<div class="image-card error">
                        <h4>${r.filename}</h4>
                        <p class="error-msg">${r.error}</p>
                    </div>`;
                }
                const score = r.anomaly_score || 0;
                const isDefect = r.is_defective;
                return `
                    <div class="image-card">
                        <h4>${r.filename}
                            <span class="badge ${isDefect ? 'danger' : ''}">${r.detection_count} 个缺陷</span>
                            <span class="badge">score: ${score.toFixed(2)}</span>
                        </h4>
                        <div class="image-pair">
                            <div class="image-side">
                                <img src="${r.original_url}" alt="原图">
                                <span class="image-tag">ORIGINAL</span>
                            </div>
                            <div class="image-side">
                                <img src="${r.result_url}" alt="检测结果">
                                <span class="image-tag">DETECTION</span>
                            </div>
                        </div>
                        <div class="card-stats">
                            ${Object.entries(r.class_counts).filter(([_, v]) => v > 0).map(([k, v]) => `
                                <span class="mini-badge">${k}: ${v}</span>
                            `).join('') || '<span class="mini-badge none">无缺陷</span>'}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateTotalCounts(counts) {
            document.getElementById('totalBrokenLarge').textContent = counts.broken_large || 0;
            document.getElementById('totalBrokenSmall').textContent = counts.broken_small || 0;
            document.getElementById('totalContamination').textContent = counts.contamination || 0;
        }
    </script>
</body>
</html>
